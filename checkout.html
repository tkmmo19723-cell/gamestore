<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NTPGame — Thanh toán</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><main><section class="section" style="max-width:700px;padding-top:100px"><a class="brand" href="index.html"><span>NTP</span><b>GAME</b></a><div class="service" style="display:block;margin-top:30px;padding:32px"><small>CHECKOUT</small><h2>Thanh <span>toán</span></h2><p style="color:#8199ba">Bản demo giao diện. Có thể kết nối Supabase/VietQR sau.</p><div id="summary"></div><button class="btn primary" style="width:100%;margin-top:20px" onclick="localStorage.setItem('ntp_order',JSON.stringify({cart,total}));location.href='orders.html'">Xác nhận đặt hàng →</button></div></section></main><script src="app.js"></script><script>let total=cart.reduce((a,x)=>a+x.price*x.qty,0);document.getElementById("summary").innerHTML=cart.length?cart.map(x=>`<p>${x.name} × ${x.qty} — <b>${(x.price*x.qty).toLocaleString("vi-VN")}đ</b></p>`).join("")+`<hr><h3>Tổng: ${total.toLocaleString("vi-VN")}đ</h3>`:"<p>Giỏ hàng trống.</p>"</script></body></html>
