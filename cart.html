<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NTPGame — Giỏ hàng</title><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><header class="header"><a class="brand" href="index.html"><span>NTP</span><b>GAME</b></a><nav><a href="index.html">Trang chủ</a><a href="shop.html">Acc Game</a><a href="services.html">Cày Thuê</a><a href="orders.html">Đơn hàng</a></nav><div class="head-actions"><a class="login" href="login.html">Đăng nhập</a><a class="cart" href="cart.html">🛒 <i id="cartCount">0</i></a></div></header><main><section class="section" style="padding-top:120px"><div class="section-head"><div><small>SHOPPING CART</small><h2>Giỏ <span>hàng</span></h2><p>Kiểm tra sản phẩm trước khi thanh toán.</p></div></div><div id="cartBox"></div></section></main><script src="app.js"></script><script>
function render(){let b=document.getElementById("cartBox");if(!cart.length){b.innerHTML='<div class="service"><i>🛒</i><div><h3>Giỏ hàng đang trống</h3><p>Hãy chọn một sản phẩm trong Shop.</p></div><a class="btn primary" href="shop.html">Vào Shop →</a></div>';return}let total=cart.reduce((a,x)=>a+x.price*x.qty,0);b.innerHTML=cart.map((x,i)=>`<div class="service" style="margin-bottom:10px"><i>🎮</i><div><h3>${x.name}</h3><p>${x.qty} × ${x.price.toLocaleString("vi-VN")}đ</p></div><b>${(x.qty*x.price).toLocaleString("vi-VN")}đ</b><button onclick="cart.splice(${i},1);save();render()" style="background:none;border:0;color:#ff7184;font-size:18px">×</button></div>`).join("")+`<div class="cta" style="margin:35px 0"><div><small>TỔNG THANH TOÁN</small><h2>${total.toLocaleString("vi-VN")}đ</h2></div><a class="btn primary" href="checkout.html">Thanh toán →</a></div>`}render();
</script></body></html>
